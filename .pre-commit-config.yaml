repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-japanese-strings
        name: check for Japanese strings in source code
        entry: ./scripts/check_no_japanese.sh
        language: system
        types: [python]
        files: ^(src|tests)/

      - id: ty-check
        name: ty type check
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
